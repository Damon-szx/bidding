[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bidding-agent"
version = "0.1.0"
description = "Skill-driven tender discovery and attachment acquisition"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "mcp>=1.12,<2", "python-dotenv>=1,<2", "sqlalchemy>=2.0,<2.1", "pymysql[rsa]>=1.1,<2", "playwright>=1.58,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/bidding"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
